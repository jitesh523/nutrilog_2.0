name: Encrypted nightly backup
on:
  schedule:
    - cron: "37 21 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    environment: backups
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.14.0"
      - name: Install reviewed dependencies without lifecycle scripts
        run: npm ci --omit=dev --ignore-scripts
      - name: Create and verify encrypted snapshot
        run: |
          node scripts/backup.js create private-backup/nightly.nlog
          node scripts/backup.js verify private-backup/nightly.nlog
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
      - name: Store only encrypted snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nutrilog-encrypted-${{ github.run_id }}
          path: private-backup/nightly.nlog
          retention-days: 14
          if-no-files-found: error
      - name: Remove temporary snapshot
        if: always()
        run: rm -f private-backup/nightly.nlog
