name: Production health
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check app and database
        run: |
          curl --fail --silent --show-error --max-time 45 --retry 2 --retry-delay 5 https://nutrilog-diet-ai.vercel.app/healthz | python3 -c 'import json,sys; assert json.load(sys.stdin).get("ok") is True'
